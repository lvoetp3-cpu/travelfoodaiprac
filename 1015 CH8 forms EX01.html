<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH8表單排版-線上報名</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/myall-css.css">

</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="display-3 text-bg-primary zm-500 text-center py-3 my-3">課程線上報名表</div>
            </div>
        </div>

        <!-- <div class="col-12">
                <ul>
                    <li>1.Email:包含@這個字元，使用includes() ; 8-15字</li>
                    <li>2.密碼:8-16字</li>
                    <li>3.手機:10個字:開頭為09-xxxxxxxx , 使用startwith()</li>
                </ul>
            </div> -->

        <div class="row p-2">
            <div class="col-12 bg-light">
                <div class="mb-3">
                    <label for="username" class="form-label">姓名</label>
                    <input type="text" class="form-control form-control-lg" id="username" placeholder="姓名字串長度2-8!">
                    <div class="valid-feedback">姓名字串長度符合規定</div>
                    <div class="invalid-feedback">姓名字串長度不符合規定</div>
                </div>
            </div>
        </div>

        <div class="row p-2">
            <div class="col-12 bg-light">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" class="form-control form-control-lg" id="email" placeholder="請輸入 Email (需包含@)">
                    <div class="valid-feedback">Email 格式與長度符合規定</div>
                    <div class="invalid-feedback">Email 格式或長度不符合規定</div>
                </div>
            </div>
        </div>

        <div class="row p-2">
            <div class="col-12 bg-light">
                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control form-control-lg" id="password"
                        placeholder="請輸入密碼 (長度8-16!)">
                    <div class="valid-feedback">密碼字串長度符合規定</div>
                    <div class="invalid-feedback">密碼字串長度不符合規定</div>
                </div>
            </div>
        </div>

        <div class="row p-2">
            <div class="col-12 bg-light">
                <div class="mb-3">
                    <label for="phone" class="form-label">手機</label>
                    <input type="text" class="form-control form-control-lg" id="phone"
                        placeholder="請輸入手機號碼 (10位數，09開頭)">
                    <div class="valid-feedback">手機號碼格式符合規定</div>
                    <div class="invalid-feedback">手機號碼格式不符合規定</div>
                </div>
            </div>
        </div>

        <div class="row p-2">
            <div class="col-12 bg-light mb-3">
                <label for="city" class="form-label">居住縣市</label>
                <!-- 將 id 改為 city，並加上 Bootstrap 的樣式類別 -->
                <select name="city" id="city" class="form-select form-select-lg">
                    <option value="" disabled selected>...請選擇縣市</option>
                </select>
                <div class="valid-feedback">已選擇縣市名稱</div>
                <div class="invalid-feedback">未選擇縣市名稱</div>
            </div>
        </div>

        <div class="row p-2">
            <div class="col-12 bg-light mb-3">
                <!-- check 區塊 -->
                <label class="form-label d-block">感興趣的課程(可複選)</label>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" id="chk01" value="HTML/CSS" name="interest">
                    <label for="chk01" class="form-check-label">HTML。CSS</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" id="chk02" value="Vibe Coding" name="interest">
                    <label for="chk02" class="form-check-label">Vibe Coding</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" id="chk03" value="PYTHON/JAVA/GOLANG"
                        name="interest">
                    <label for="chk03" class="form-check-label">PYTHON。JAVA。GOLANG</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" id="chk04" value="JUST ASK" name="interest">
                    <label for="chk04" class="form-check-label">JUST ASK</label>
                </div>
                <div id="interest_msg" class="text-secondary mt-1">
                    請至少選擇一項課程
                </div>
            </div>
        </div>

        <div class="row p-2">
            <div class="col-12 bg-light mb-3">
                <!-- Radio 區塊 -->
                <label class="form-label d-block">偏好的上課方式(單選)</label>
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" id="rad01" value="實體課程" name="classmode">
                    <label for="rad01" class="form-check-label">實體課程</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" id="rad02" value="線上課程" name="classmode">
                    <label for="rad02" class="form-check-label">線上課程</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" id="rad03" value="混合課程" name="classmode">
                    <label for="rad03" class="form-check-label">混合課程</label>
                </div>
                <div id="classmode_msg" class="text-secondary mt-1">請選擇一樣上課方式</div>
            </div>
        </div>
        <!-- switch -->

        <div class="row">
            <div class="col-12 mb-3">
                <label for="" class="form-label fw-bold">課程通知設定</label>
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" role="switch" id="switch01" name="switch01">
                    <label for="switch01" class="form-check-label">是否接收最新的課程資訊</label>
                </div>
            </div>
            <div id="switch_msg" class="text-secondary mt-2">目前狀態；關閉</div>
        </div>

        <!--range-->
        <div class="mb-3">
            <label for="" class="form-label">程式能力自我評估:<span class="text-primary zm-300 fs-3" id="range_val">5</span>分
            </label>
            <input type="range" class="form-range" min="1" max="10" step="1" value="5" id="range01">
            <div class="d-flex justify-content-between">
                <span class="text-secondary">1-完全不會</span>
                <span class="text-secondary">10-非常熟悉</span>
            </div>

        </div>

        <!-- 信用卡卡號輸入欄位 -->
        <div class="mb-3">
            <label for="credit_card" class="form-label">信用卡卡號</label>
            <div class="d-flex align-items-center gap-2" id="credit_card_group">
                <!-- 利用 maxlength="4" 限制各框只能輸入 4 碼 -->
                <input type="text" class="form-control text-center card-input" id="card1" maxlength="4"
                    placeholder="0000" inputmode="numeric" pattern="[0-9]*">
                <span>-</span>
                <input type="text" class="form-control text-center card-input" id="card2" maxlength="4"
                    placeholder="0000" inputmode="numeric" pattern="[0-9]*">
                <span>-</span>
                <input type="text" class="form-control text-center card-input" id="card3" maxlength="4"
                    placeholder="0000" inputmode="numeric" pattern="[0-9]*">
                <span>-</span>
                <input type="text" class="form-control text-center card-input" id="card4" maxlength="4"
                    placeholder="0000" inputmode="numeric" pattern="[0-9]*">
            </div>
            <!-- 驗證後的 Feedback 提示與資安提示訊息文字區塊 -->
            <div id="card_msg" class="form-text text-secondary">請輸入 16 位數信用卡卡號</div>
        </div>

        <div class="row p-2">
            <div class="col-12 text-center mt-3">
                <button type="button" class="btn btn-primary" id="ok_btn">確認送出</button>
                <button type="button" class="btn btn-secondary" id="reset_btn">重新填寫</button>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="display-5 text-bg-success zm-500 text-center py-3 my-3">報名資料確認</div>
            </div>
            <div class="col-12" id="showmsg">

            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script>
        // 1. 初始化所有驗證 Flag 狀態
let flag_username = false;
let flag_email = false;
let flag_password = false;
let flag_phone = false;
let flag_city = false;
let flag_interest = false;
let flag_classmode = false;
let flag_credit_card = false; 

let interest = [];
let classmode = "";
let switchStatus = false;
let range = false;
let score = 5;

$(function () {
    // === 2. 即時監聽：姓名輸入框 ===
    $("#username").on("input", function () {
        console.log($(this).val().length);
        if ($(this).val().length > 1 && $(this).val().length < 9) {
            console.log("符合規定");
            $(this).removeClass("is-invalid").addClass("is-valid");
            flag_username = true;
            localStorage.setItem("username", $(this).val());
        } else {
            console.log("不符合規定!");
            $(this).removeClass("is-valid").addClass("is-invalid");
            flag_username = false;
        }
    });

    // === 3. 即時監聽：Email 輸入框 ===
    $("#email").on("input", function () {
        let val = $(this).val();
        let vallen = val.length;
        console.log("當前長度: " + vallen + " , 是否包含@: " + val.includes("@"));

        localStorage.setItem("email", val);

        if (vallen >= 3 && vallen <= 30 && val.includes("@")) {
            console.log("符合規定");
            $(this).removeClass("is-invalid").addClass("is-valid");
            flag_email = true;
        } else {
            console.log("不符合規定!");
            $(this).removeClass("is-valid").addClass("is-invalid");
            flag_email = false;
        }
    });

    // === 4. 即時監聽：密碼輸入框 ===
    $("#password").on("input", function () {
        console.log($(this).val().length);

        if ($(this).val().length >= 8 && $(this).val().length <= 16) {
            console.log("符合規定");
            $(this).removeClass("is-invalid").addClass("is-valid");
            flag_password = true;
        } else {
            console.log("不符合規定!");
            $(this).removeClass("is-valid").addClass("is-invalid");
            flag_password = false;
        }
    });

    // === 5. 即時監聽：手機輸入框 ===
    $("#phone").on("input", function () {
        let val = $(this).val();
        let vallen = val.length;
        console.log("當前長度: " + vallen + " , 是否為09開頭: " + val.startsWith("09"));

        localStorage.setItem("phone", val);

        if (vallen === 10 && val.startsWith("09")) {
            console.log("符合規定");
            $(this).removeClass("is-invalid").addClass("is-valid");
            flag_phone = true;
        } else {
            console.log("不符合規定!");
            $(this).removeClass("is-valid").addClass("is-invalid");
            flag_phone = false;
        }
    });

    // === 5-2. 即時監聽：信用卡卡號 (自動跳格與驗證) ===
    $(".card-input").on("input", function () {
        let currentVal = $(this).val().replace(/\D/g, '');
        $(this).val(currentVal);

        if (currentVal.length === 4) {
            $(this).nextAll(".card-input").first().focus();
        }

        let totalCardNumber = $("#card1").val() + $("#card2").val() + $("#card3").val() + $("#card4").val();

        if (totalCardNumber.length === 16) {
            $(".card-input").removeClass("is-invalid").addClass("is-valid");
            $("#card_msg").removeClass("text-secondary text-danger").addClass("text-success").text("信用卡格式正確！");
            flag_credit_card = true;
        } else {
            $(".card-input").removeClass("is-valid");
            $("#card_msg").removeClass("text-success text-danger").addClass("text-secondary").text("請輸入 16 位數信用卡卡號");
            flag_credit_card = false;
        }
    });

    // === 6. 讀取外部縣市 JSON 資料 ===
    $.ajax({
        type: "GET",
        url: "js/json/CityCountyData.json",
        dataType: "json",
        success: showdata_city,
        error: function () {
            alert("error - js/json/CityCountyData.json");
        }
    });

    // === 7. 監聽：縣市選單 change 事件 ===
    $("#city").on("change", function () {
        console.log($(this).val());

        if ($(this).val() === "") {
            $(this).removeClass("is-valid").addClass("is-invalid");
            flag_city = false;
        } else {
            $(this).removeClass("is-invalid").addClass("is-valid");
            flag_city = true;
        }
    });

    // === 8. 監聽：多選核取方塊 (Checkbox) ===
    $("input[name='interest']").on("change", function () {
        interest = [];
        $("input[name='interest']:checked").each(function () {
            console.log($(this).val());
            interest.push($(this).val());
        });

        console.log(interest);

        if (interest.length > 0) {
            flag_interest = true;
            $("#interest_msg")
                .removeClass("text-secondary text-danger")
                .addClass("text-success")
                .text("已經選擇 " + interest.length + " 項課程");
        } else {
            flag_interest = false;
            $("#interest_msg")
                .removeClass("text-secondary text-success")
                .addClass("text-danger")
                .text("請至少選擇一項課程");
        }
    });

    // === 9. 監聽：單選上課方式 (Radio) ===
    $("input[name='classmode']").on("change", function () {
        classmode = $("input[name='classmode']:checked").val() || "";
        console.log(classmode);

        if (classmode !== "") {
            flag_classmode = true;
            $("#classmode_msg")
                .removeClass("text-secondary text-danger")
                .addClass("text-success")
                .text("已經選擇：" + classmode);
        }
    });

    // === 10. 監聽：通知設定開關 (Switch) ===
    $("#switch01").on("change", function () {
        console.log($(this).prop("checked"));
        switchStatus = $(this).prop("checked");

        if (switchStatus) {
            $("#switch_msg")
                .removeClass("text-secondary")
                .addClass("text-success")
                .text("目前狀態：開啟");
        } else {
            $("#switch_msg")
                .removeClass("text-success")
                .addClass("text-secondary")
                .text("目前狀態：關閉");
        }
    });

    // === 11. 監聽：自我評估滑桿 (Range) ===
    $("#range01").on("input", function () {
        console.log($(this).val());
        score = $(this).val();
        $("#range_val").text(score);
    });

    // === 12. 監聽：確認送出按鈕 (#ok_btn) ===
    $("#ok_btn").on("click", function () {
        if (flag_username && flag_email && flag_password && flag_phone && flag_city && flag_interest && flag_classmode && flag_credit_card) {
            console.log("符合規定!");

            Swal.fire({
                title: "是否確認送出報名資料？",
                showDenyButton: true,
                showCancelButton: false,
                confirmButtonText: "確認送出",
                denyButtonText: "取消",
                icon: "question"
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire("送出成功!", "您的報名資料已確認。", "success");

                    // 🎯【呼叫老師的功能】確認送出成功時，執行老師寫的清除函式
                    clearLocalStorage();

                    let switch_msg = switchStatus ? "目前狀態：開啟" : "目前狀態：關閉";

                    const strHTML = `
                        <div class="h2">姓名：${$("#username").val()}</div>
                        <div class="h2">Email：${$("#email").val()}</div>
                        <div class="h2">密碼：xxxxx</div>
                        <div class="h2">電話：${$("#phone").val()}</div>
                        <div class="h2">信用卡號：${$("#card1").val()}-****-****-${$("#card4").val()}</div>
                        <div class="h2">居住地：${$("#city").val()}</div>
                        <div class="h2">感興趣的課程：${interest.join("、")}</div>
                        <div class="h2">偏好的上課方式：${classmode}</div>
                        <div class="h2">${switch_msg}</div>
                        <div class="h2">程式能力自我評估：${score}分</div>
                    `;

                    $("#showmsg").html(strHTML);
                } else if (result.isDenied) {
                    Swal.fire("已取消動作", "資料未送出。", "info");
                }
            });

        } else {
            console.log("不符合規定!");

            Swal.fire({
                title: "表單內容錯誤，請修正?",
                showDenyButton: false,
                showCancelButton: false,
                confirmButtonText: "確認",
                denyButtonText: `Don't save`,
                icon: "error"
            }).then((result) => {
                if (result.isConfirmed) {
                    // 老師演示的重整（保留註解不執行）
                    // location.href = "1015 CH8 forms EX01.html";
                }
            });

            if (!flag_username) $("#username").removeClass("is-valid").addClass("is-invalid");
            if (!flag_email) $("#email").removeClass("is-valid").addClass("is-invalid");
            if (!flag_password) $("#password").removeClass("is-valid").addClass("is-invalid");
            if (!flag_phone) $("#phone").removeClass("is-valid").addClass("is-invalid");
            if (!flag_city) $("#city").removeClass("is-valid").addClass("is-invalid");
            
            if (!flag_credit_card) {
                $(".card-input").removeClass("is-valid").addClass("is-invalid");
                $("#card_msg").removeClass("text-secondary text-success").addClass("text-danger").text("信用卡卡號未填寫完整！");
            }

            if (!flag_interest) {
                $("#interest_msg").removeClass("text-secondary text-success").addClass("text-danger").text("請至少選擇一項課程");
            }
            if (!flag_classmode) {
                $("#classmode_msg").removeClass("text-secondary text-success").addClass("text-danger").text("請選擇一樣上課方式");
            }
        }
    });

        // === 13. 監聽：重新填寫按鈕 (#reset_btn) ===
    $("#reset_btn").on("click", function () {
        console.log("重新填寫 #reset_btn");

        // 🎯【呼叫老師的功能】觸發老師第 447 行教的清除專用箱子
        clearLocalStorage();

        // 🎯【執行老師的重整】清除完後，立刻執行老師第 421 行寫的網頁重整
        location.reload();
    });

    // === 自動讀取與還原暫存 ===
    let savedUsername = localStorage.getItem("username");
    if (savedUsername !== null) {
        $("#username").val(savedUsername);
        $("#username").trigger("input"); 
    }

    let savedEmail = localStorage.getItem("email");
    if (savedEmail !== null) {
        $("#email").val(savedEmail);
        $("#email").trigger("input"); 
    }

    let savedPhone = localStorage.getItem("phone");
    if (savedPhone !== null) {
        $("#phone").val(savedPhone);
        $("#phone").trigger("input"); 
    }
}); // 確實關閉前端主執行緒 $(function ()

// ========================================================
// 🎯【老師課堂核心代碼】獨立在最外層的自訂清除函式與縣市渲染
// ========================================================

function clearLocalStorage() {
    // 老師截圖中的兩行核心原始碼
    localStorage.removeItem("username");
    localStorage.removeItem("email");
    
    // 額外幫你把手機也加進來，確保大掃除最徹底
    localStorage.removeItem("phone");
}

function showdata_city(data) {
    console.log(data);
    $("#city").empty();
    $("#city").append('<option value="" class="text-center zm-300">---請選擇縣市名稱---</option>');

    data.forEach(function (item, index) {
        console.log(item.CityName);
        const count = index + 1;
        const strHTML = `<option value="${item.CityName}">${count}:${item.CityName}</option>`;
        $("#city").append(strHTML);
    });
}
</script>
</body>
</html>

 
<!-- npm install "sweetalert2套件" -->
