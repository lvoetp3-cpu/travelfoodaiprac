<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">法國旅記</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">首頁</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">相關連結</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                美術館
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">羅浮宮</a></li>
                                <li><a class="dropdown-item" href="#">凡爾賽宮</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled">Disabled</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="row row-cols-1 row-cols-md-2 g-4 mt-2 ps-2 pe-2" id="foodlist">
            <div class="col">
                <div class="card">
                    <img src="images/josephine-bevan-MtRfjqCLJaU-unsplash.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="display-6 fw-500 text-start">餐廳名稱</h5>
                        <h5 class="h5 text-start">地址:XXXX</h5>
                        <h5 class="h5 text-start">電話:0912345678</h5>
                        <p class="card-text text-truncate">This is a longer card with supporting text below as a natural
                            lead-in to additional content. This content is a little bit longer.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <ul class="nav justify-content-center">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Active</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item">
            <a class="nav-link disabled">Disabled</a>
        </li>
    </ul>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/travelfood.js"></script>
    <script>
        console.log(food);

        $("#foodlist").empty(); // 清空原本占位的第一張圖
        food.forEach(function (item) {
            const strHTML = `<div class="col">
                   <div class="card">
                        <img src="${item.PicURL}" class="card-img-top" alt="...">
                        <div class="card-body">
                            <h5 class="display-6 fw-900 text-start">${item.Name}</h5>
                            <h5 class="h5 text-start">${item.City}</h5>
                            <h5 class="h5 text-start">${item.Tel}</h5>
                            <p class="card-text text-truncate">This is a longer card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.</p>
                        </div>
                    </div>
                </div>`;
            $("#foodlist").append(strHTML);
        });
    </script>
</body>

</html>
