<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習01. 使用CSS語法配置版面</title>
    <style>
        :root{
            --mncolor01:#ebc2c2
            --mncolor02:#000000
        }
        /* 將原點定位置0 */
        *{
            margin: 0;
            padding: 0;
        }
        body {
            background-color:var(--mncolor01);
        }

        .wrapper {
            width: 1024px;!
            margin-top: 0px;
            margin-bottom: 0px;
            margin-left: auto;
            margin-right: auto;
        }

        .logo {
            width: 1024px;
            height: 320px;
            background-color: var(--mncolor02);
            background-image: url(images/venus-major-3czvr_EDCtg-unsplash.jpg);
            background-position: center center;
            background-size: cover;
        }

        .nav {
            background-color: #47380fb9;
            text-align: center;
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .nav ul {
            display: inline-block;
        }

        .nav ul li {
            float: left;
            list-style-type: none;
        }

        .nav ul li a {
            text-decoration: none;
            background-color: #3a1b04c7;
            color: aliceblue;
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 20px;
            padding-right: 20px;
            margin-right: 10px;
            border-radius: 15px;
            box-shadow: 2px 2px 2px 2px #14090118;
            font-size: 15px;
            font-weight: bold;

        }
        .nav ul li a:hover{
            border-radius: 15px;
            box-shadow: 2px 2px 2px 2px #f78d4218;
            color: rgba(24, 151, 255, 0.603);
        }

        .content{
            padding: 30px 30px 50px 50px;
            background-color: #fff;
        }

        .content h1{
            text-align: center;
            margin-bottom: 30px;
        }
        
        .content p{
            font-size: 24px;
            margin-top: 20px;
        }

        .content a{
            display: block;
            background-color: #8f0707;
            width: 120px;
            height: 40px;
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
            text-decoration: none;
            color: aliceblue;
            text-align: center;
            font-size: 18px;
            line-height: 40px;
            font-weight: bold;
            box-shadow: 2px 2px 2px 2px #200202;
            border-radius: 7px;
        }
        .footer{
            background-color: #5f0f0f;
            color: aliceblue;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding-top: 10px;
            padding-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="banner">
            <div class="logo"></div>

            <div class="nav">
                <ul>
                    <li><a href="#">首頁</a></li>
                    <li><a href="#">最新消息</a></li>
                    <li><a href="#">合作店家</a></li>
                    <li><a href="#">關於我們</a></li>
                    <li><a href="#">聯絡我們</a></li>
                </ul>
                </ul>
            </div>
        </div>
        <div class="content">
            <h1>歡迎光臨</h1>
            <p>第二一份第二章您是上午預覽出租發展供應設定，老大以及歐美說過工具去了認為，財務合適方向，離線榮譽馬。</p>
            <p>成績是我運動商家預覽一些學者山西上升億元廣大投資中文，好激動知識信心它們每個加上國產卻是太陽豐富看起來配合，請您不說，內心找不到完成投訴三年主題審核，文化瀏覽引擎你想尊重交換攝影我想並沒有共享，昨天。</p>
            <p>你自己本月戰爭但在不在有利於原文達到，公斤實施看到轉載主管第三透露不喜歡選擇召開漸漸女子，未經婦女，專題女孩天堂，關注。</p>
            <a href="#">了解更多</a>
        </div>
        <div class="footer">
            PowerBy 26.2026.9.23
        </div>
    </div>
</body>

</html>
