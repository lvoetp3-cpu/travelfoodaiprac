<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap切版exercise02</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/myall-css.css">
    <style>
        :root {
            /* 青鳥色系（Bluebird Palette）語意變數 */
            --runway-black: #0c1a24;            /* 深邃夜羽藍（原漆黑） */
            --miranda-cream: #eef7f9;           /* 晨空淡青藍（原背景底色） */
            --vogue-gold-trans: #1d4d62b9;      /* 湖水綠松石（原半透明導覽列） */
            --couture-espresso: #133344c7;      /* 沉穩深海藍（原按鈕底色） */
            --cerulean-blue: rgba(255, 183, 3, 0.9); /* 青鳥報喜金黃（原Hover文字） */
            --editorial-white: #ffffff;         /* 純淨羽毛白（原純白內頁） */
            --burgundy-red: #0077b6;            /* 幸福青鳥藍（原了解更多按鈕） */
            --devil-crimson: #005f73;           /* 典雅深青綠（原頁尾底色） */

            /* 陰影與細節顏色 */
            --shadow-soft: #0a1b2415;
            --shadow-glow: #00b4d818;
            --shadow-dark: #002830;
            --text-light: aliceblue;
        }

        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--miranda-cream);
        }

        .logo {
            width: 100%;
            height: 320px;
            background-color: var(--runway-black);
            background-image: url(https://lvoetp3-cpu.github.io/travelfoodaiprac/images/Gemini_Generated_Image_1fif261fif261fif.png);
            background-position: center center;
            background-size: cover;
        }

        .content {
            padding: 30px 30px 50px 50px;
            background-color: var(--editorial-white);
        }

        .content h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .content p {
            font-size: 24px;
            margin-top: 20px;
        }

        .content a {
            display: block;
            background-color: var(--burgundy-red);
            width: 120px;
            height: 40px;
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
            text-decoration: none;
            color: var(--text-light);
            text-align: center;
            font-size: 18px;
            line-height: 40px;
            font-weight: bold;
            box-shadow: 2px 2px 2px 2px var(--shadow-dark);
            border-radius: 7px;
        }

        .footer {
            background-color: var(--devil-crimson);
            color: var(--text-light);
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .box02 {
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--runway-black);
            background-color: #f8f9fa;

            border: 1px solid rgba(12, 26, 36, 0.1);
            border-radius: 6px;

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;

            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            margin-bottom: 20px;
        }

        .box02:hover {
            color: var(--editorial-white);
            background-color: var(--runway-black);
            border-color: var(--runway-black);
            box-shadow: 0 8px 16px rgba(12, 26, 36, 0.08);
            transform: translateY(-3px);
        }

        .box03 {
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 2px 2px 2px 2px #8b8b8b;
            height: 100%;
            background: #fff;
        }

        .box03 img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }

        .box03 .intro {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 16px;
            line-height: 1.5;
        }

        /* 當螢幕寬度大於 992px（平板與小桌機）時 */
        @media screen and (min-width: 992px) {
            .box02 {
                height: 52px;
                max-width: 160px;
                font-size: 16px;
                margin: 0 auto;
                margin-bottom: 20px;
            }
        }

        /* 當螢幕寬度大於 1200px（大型桌上型電腦）時 */
        @media screen and (min-width: 1200px) {
            .box02 {
                height: 56px;
                max-width: 180px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="banner">
            <div class="logo"></div>
        </div>
        <div class="content">
            <div class="container">
                <div class="row">
                    <div class="col-sm-6 col-md-3 mt-3">
                        <div class="box02 bg-light h1 text-center fw-900">選單01</div>
                    </div>
                    <div class="col-sm-6 col-md-3 mt-3">
                        <div class="box02 bg-light h1 text-center fw-900">選單02</div>
                    </div>
                    <div class="col-sm-6 col-md-3 mt-3">
                        <div class="box02 bg-light h1 text-center fw-900">選單03</div>
                    </div>
                    <div class="col-sm-6 col-md-3 mt-3">
                        <div class="box02 bg-light h1 text-center fw-900">選單04</div>
                    </div>
                </div>
                <div class="row" id="product">
                    <div class="col-12 text-center py-4">資料載入中...</div>
                </div>
            </div>
        </div>
        <div class="footer">TCTC COPYRIGHT 2026</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        const FALLBACK_IMG = "images/placeholder.svg";

        $(function () {
            // 圖1 能顯示資料，是因為用了農村美食開放資料（Name / City / Tel / PicURL）。
            // 圖2 原本打 http://localhost:3000/products，本機沒開 json-server 就會「介接失敗」。
            // 這裡改讀同資料來源的本地 JSON，Live Server / GitHub Pages 都能用。
            $.ajax({
                type: "GET",
                url: "js/travelfood.json",
                dataType: "json",
                success: showdata,
                error: function () {
                    $.ajax({
                        type: "GET",
                        url: "https://data.moa.gov.tw/Service/OpenData/ODwsv/ODwsvTravelFood.aspx",
                        dataType: "json",
                        timeout: 8000,
                        success: showdata,
                        error: function () {
                            console.log("介接失敗，請用 Live Server 開啟，勿直接雙擊 HTML");
                            alert("介接失敗");
                        }
                    });
                }
            });
        });

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function showdata(data) {
            console.log("成功取得資料：", data);

            const list = Array.isArray(data) ? data : (data.products || data.food || []);
            $("#product").empty();

            if (!list.length) {
                $("#product").append('<div class="col-12 text-center py-4">目前沒有資料</div>');
                return;
            }

            list.forEach(function (item) {
                const name = escapeHtml(item.Name || "未提供店名");
                const address = escapeHtml(
                    (item.City || "") + (item.Town || "") + (item.Address || "")
                );
                const intro = escapeHtml((item.HostWords || "").replace(/\s+/g, " "));
                const pic = item.PicURL || FALLBACK_IMG;

                const strHTML =
                    '<div class="col-md-6 col-lg-4 mt-3">' +
                        '<div class="box03">' +
                            '<img src="' + pic + '" class="img-fluid" alt="' + name + '" onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">' +
                            '<div class="h4 fw-900 text-center mt-3">' + name + '</div>' +
                            '<div class="h5 px-2">地址：' + address + '</div>' +
                            '<div class="h6 px-2 intro">簡介：' + intro + '</div>' +
                        '</div>' +
                    '</div>';

                $("#product").append(strHTML);
            });
        }
    </script>
</body>
</html>
