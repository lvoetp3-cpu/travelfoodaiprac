        .box02 {
            height: 46px;                 /* 💡 手機版大幅縮小高度，輕巧精緻 */
            display: flex;
            align-items: center;
            justify-content: center;
            
            color: var(--runway-black);   /* 深邃羽藍字體 */
            background-color: #f8f9fa;    /* 質感極淺灰 */
            
            border: 1px solid rgba(12, 26, 36, 0.1); 
            border-radius: 6px;           /* 6px 黃金微圓角 */
            
            font-size: 15px;              /* 💡 縮小字體，更顯精緻 */
            font-weight: 700;             
            letter-spacing: 2px;          /* 維持時裝雜誌感的呼吸字距 */
            cursor: pointer;
            
            /* 流暢動態曲線 */
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            margin-bottom: 20px;
        }

        /* 懸浮特效：溫和反轉與輕微上浮 */
        .box02:hover {
            color: var(--editorial-white);      
            background-color: var(--runway-black); 
            border-color: var(--runway-black);
            box-shadow: 0 8px 16px rgba(12, 26, 36, 0.08); /* 縮小陰影範圍，更為低調 */
            transform: translateY(-3px);        /* 輕微上浮 */
        }
        .box03{
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 2px 2px 2px 2px #8b8b8b;
        }

        /* 當螢幕寬度大於 992px（平板與小桌機）時 */
        @media screen and (min-width: 992px) {
            .box02 {
                height: 52px;            /* 💡 電腦版同步縮小，寬高比極度俐落 */
                max-width: 160px;        /* 💡 限制最大寬度，避免電腦版長條過粗 */
                font-size: 16px;
                margin: 0 auto;          /* 配合 Bootstrap 置中 */
                margin-bottom: 20px;
            }
        }

        /* 當螢幕寬度大於 1200px（大型桌上型電腦）時 */
        @media screen and (min-width: 1200px) {
            .box02 {
                height: 56px;            /* 💡 大螢幕下依舊維持細緻小巧的比例 */
                max-width: 180px;        
                font-size: 16px;
            }
        }

<script src="js/jquery-4.0.0.js"></script>
<script>
    $(function(){
        // 介接資料
        $.ajax({
            type: "GET",
            url: "http://localhost:3000/products",
            dataType: "json",
            success: showdata,
            error: function(){
                console.log("介接失敗，請檢查 API 是否開啟或有 CORS 問題");
                alert("介接失敗");
            }
        });
    });

    function showdata(data){
        console.log("成功取得資料：", data);
        
        // 清空原本寫死在 HTML 裡的第一筆測試資料（避免重複呈現）
        $("#product").empty();

        // 修正：因為 data 本身就是陣列，直接對 data 進行迴圈即可
        data.forEach(function(item) {
            const strHTML = '<div class="col-md-6 col-lg-4 mt-3">' +
                '<div class="box03">' +
                    '<img src="images/landspace02.avif" class="img-fluid" alt="">' +
                    '<div class="h4 fw-900 text-center mt-3">' + item.Name + '</div>' +
                    '<div class="h3">' + item.City + item.Town + item.Address + '</div>' +
                    '<div class="h3">' + item.HostWords + '</div>' +
                '</div>' +
            '</div>';
            
            $("#product").append(strHTML);
        });
    }
</script>
